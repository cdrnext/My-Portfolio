<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Manoj-Bhagya-Homecoming</title>
  
  <!-- SEO & Social Meta Tags -->
  <meta name="description" content="You are warmly invited to celebrate the Homecoming Night Party of Manoj & Bhagya. Let's reunite, celebrate & make beautiful memories together! November 14, 2026 from 5:30 PM at Royal Rest House, Peradeniya.">
  <meta property="og:title" content="Manoj & Bhagya – Homecoming Night Party Invitation">
  <meta property="og:description" content="Join us for our Homecoming Night Party! 5:30 PM Onwards – November 14, 2026 at Royal Rest House, Peradeniya. Kindly RSVP via Google Form.">
  <meta property="og:image" content="asset/homecoming_first.jpg">
  <meta property="og:type" content="website">

  <!-- Style Sheet -->
  <link rel="stylesheet" href="style.css">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Background Music (muted autoplay – unmutes on first interaction) -->
  <audio id="bgAudioEl" loop muted autoplay preload="auto">
    <source src="asset/Ordinary (Violin Version).MP3" type="audio/mpeg">
    <audio id="bgAudioEl" loop muted autoplay preload="auto">
     <audio id="bgAudioEl" loop muted autoplay preload="auto" playsinline>
  </audio>

  <!-- Floating Particle Canvas (Stars & Confetti) -->
  <canvas id="particles-canvas"></canvas>

  <!-- Floating Controls (Music Toggle) -->
  <div class="floating-controls">
    <button id="musicToggleBtn" class="control-btn" title="Toggle Party Music" aria-label="Toggle Music">
      <i class="fas fa-music"></i>
    </button>
  </div>

  <div class="app-viewport">
    
    <!-- ==========================================================================
         1. LUXURY HOMECOMING ENVELOPE UNBOXING EXPERIENCE
         ========================================================================== -->
    <div id="envelopeWrapper" class="envelope-wrapper">
      <canvas id="seal-burst-canvas"></canvas>

      <div class="envelope-hint">
        <i class="fas fa-star"></i> TAP SEAL TO OPEN INVITATION <i class="fas fa-star"></i>
      </div>

      <!-- Royal Envelope Container -->
      <div class="envelope-container">
        <!-- Inside Card: New Dancing Couple Image -->
        <div class="envelope-card-inside" style="padding: 6px;">
          <img src="asset/homecoming_first.jpg" alt="Manoj & Bhagya – Homecoming Night Party" style="width:100%; height:100%; object-fit:cover; border-radius:10px; display:block;">
        </div>

        <!-- Top Envelope Flap -->
        <div class="envelope-cover-top">
          <div class="envelope-header-text">
            <div class="cover-motif">✨ 🎉 ✨</div>
            <div class="cover-monogram">M ♥ B</div>
            <h3 class="cover-couple-title">Manoj &amp; Bhagya</h3>
            <div class="cover-love-tag">HOMECOMING NIGHT PARTY</div>
            <div class="cover-date-text">NOVEMBER 14, 2026 • ROYAL REST HOUSE, PERADENIYA • 5:30 PM</div>
          </div>
        </div>

        <!-- Bottom Envelope Pocket -->
        <div class="envelope-cover-bottom">
          <div class="cover-gold-line"></div>
        </div>

        <!-- Glowing Wax Seal Button -->
        <div class="seal-ripple-ring"></div>
        <button id="waxSealBtn" class="wax-seal-btn" title="Tap to Open Invitation" aria-label="Tap Seal to Open Invitation">
          <img src="asset/wax_seal.png" alt="Gold Wax Seal" class="wax-seal-img">
        </button>
      </div>
    </div>

    <!-- ==========================================================================
         2. MAIN HOMECOMING INVITATION CONTENT
         ========================================================================== -->
    <main id="invitationMain" class="invitation-main">
      
      <!-- HERO HEADER -->
      <header class="hero-header">
        <div class="gold-border-frame"></div>
        <div class="traditional-motif-icon">✨ 🎉 ✨</div>
        <div class="monogram-badge">M ♥ B</div>
        <div class="save-the-date-tag">YOU ARE WARMLY INVITED</div>
        <h1 class="event-title-script">Homecoming</h1>
        <h2 class="event-subtitle-script">Night Party</h2>

        <!-- FIRST Image: Dancing Couple -->
        <div class="hero-banner-box">
          <img src="asset/homecoming_first.jpg" alt="Manoj &amp; Bhagya – Homecoming Night Party">
        </div>

        <h1 class="couple-names">
          Manoj <span>&amp;</span> Bhagya
        </h1>
        <div class="love-badge">
          Let's Reunite, Celebrate &amp; Make Beautiful Memories Together!
        </div>
      </header>

      <!-- HOMECOMING NIGHT HIGHLIGHT CARD -->
      <section class="poruwa-feature-card">
        <h3 class="poruwa-card-title">
          🎊 Homecoming Night Party 🎊
        </h3>
        
        <div class="poruwa-time-grid" style="grid-template-columns: 1fr;">
          <div class="time-card-highlight">
            <div class="time-card-label">Saturday, November 14, 2026</div>
            <div class="time-card-icon"><i class="fas fa-champagne-glasses"></i></div>
            <div class="time-card-label">Evening Begins</div>
            <div class="time-card-value">5:30 PM Onwards</div>
          </div>
        </div>

        <p class="poruwa-desc" style="margin-bottom: 0;">
          We warmly request your gracious presence as Manoj &amp; Bhagya host an enchanting Homecoming Night Party filled with joy, music, laughter, and love!
        </p>
      </section>

      <!-- COUNTDOWN TIMER SECTION -->
      <section class="section-card">
        <div class="section-title">Counting Down</div>
        <div class="section-subtitle">To Our Homecoming Night</div>
        <div class="gold-divider"></div>

        <div class="countdown-grid">
          <div class="countdown-item">
            <div id="days" class="countdown-num">00</div>
            <div class="countdown-label">Days</div>
          </div>
          <div class="countdown-item">
            <div id="hours" class="countdown-num">00</div>
            <div class="countdown-label">Hours</div>
          </div>
          <div class="countdown-item">
            <div id="minutes" class="countdown-num">00</div>
            <div class="countdown-label">Mins</div>
          </div>
          <div class="countdown-item">
            <div id="seconds" class="countdown-num">00</div>
            <div class="countdown-label">Secs</div>
          </div>
        </div>

      </section>
      
      <!-- EVENT DETAILS & LOCATION SECTION -->
      <section class="section-card">
        <div class="section-title">Party Details</div>
        <div class="section-subtitle">Date, Time &amp; Venue</div>
        <div class="gold-divider"></div>

        <div class="event-info-list">
          <div class="event-info-item">
            <div class="event-icon"><i class="fas fa-calendar-check"></i></div>
            <div class="event-details">
              <h4>Event Date</h4>
              <p>Saturday, November 14, 2026</p>
            </div>
          </div>

          <div class="event-info-item">
            <div class="event-icon"><i class="fas fa-clock"></i></div>
            <div class="event-details">
              <h4>Event Time</h4>
              <p>5:30 PM Onwards</p>
            </div>
          </div>

          <div class="event-info-item">
            <div class="event-icon"><i class="fas fa-glass-cheers"></i></div>
            <div class="event-details">
              <h4>Hall</h4>
              <p>King's Ballroom</p>
            </div>
          </div>

          <div class="event-info-item">
            <div class="event-icon"><i class="fas fa-map-marker-alt"></i></div>
            <div class="event-details">
              <h4>Venue</h4>
              <p>Royal Rest House, Peradeniya</p>
            </div>
          </div>
        </div>

        <!-- Map + RSVP buttons -->
        <div style="margin-top: 20px; display: flex; flex-direction: column; gap: 12px;">
          <a href="https://share.google/6J5byoG0V9HshOmCD" target="_blank" rel="noopener" class="btn-primary" style="text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px;">
            <i class="fas fa-map-marked-alt"></i> View On Map
          </a>
         
        </div>
      </section>


      <!-- OUR CELEBRATION & PHOTO SECTION -->
      <section class="section-card">
        <div class="section-title">💕 Our Love Story</div>
        <div class="section-subtitle">14 Years of Love • One Beautiful Forever</div>
        <div class="gold-divider"></div>


        <!-- Banner Image -->
        <div class="story-photo-box">
          <img src="asset/homecoming_banner.png" alt="Manoj &amp; Bhagya – Celebrate Our Homecoming">
        </div>

       <div class="love-story-body">

          <p class="love-story-para">
            What began as a young love story <strong>14 years ago</strong> has grown into a beautiful journey filled with countless memories, dreams, challenges, laughter, and love.
          </p>

          <div class="love-story-divider">
            <span>❤️</span>
          </div>

          <p class="love-story-para">
            Through every season of life, <strong>Manoj &amp; Bhagya</strong> have walked together, creating memories that will forever remain in their hearts.
          </p>

          <div class="love-story-divider">
            <span>✨</span>
          </div>

          <p class="love-story-para">
            Now, after <strong>14 wonderful years of love</strong>, we are now beginning a new chapter of our lives together as husband and wife.
          </p>

          <div class="love-story-divider">
            <span>🌹</span>
          </div>

          <p class="love-story-para">
            With hearts full of happiness and gratitude, we warmly invite you to celebrate our <strong>Homecoming</strong> with us, surrounded by our beloved family and friends who have been a special part of our journey.
          </p>

          <div class="love-story-signature">
            <div class="love-story-names">Manoj ❤️ Bhagya</div>
            <div class="love-story-tagline">14 Years of Love. One Lifetime to Go.</div>
          </div>

        </div>

        <!-- Photo Gallery Section -->
        <div class="photo-gallery-grid">
          <div class="gallery-item"><img src="asset/1.JPG" alt="Manoj &amp; Bhagya Moment 1" loading="lazy"></div>
          <div class="gallery-item"><img src="asset/2.JPG" alt="Manoj &amp; Bhagya Moment 2" loading="lazy"></div>
          <div class="gallery-item"><img src="asset/3.JPG" alt="Manoj &amp; Bhagya Moment 3" loading="lazy"></div>
          <div class="gallery-item"><img src="asset/4.JPG" alt="Manoj &amp; Bhagya Moment 4" loading="lazy"></div>
          <div class="gallery-item"><img src="asset/5.JPG" alt="Manoj &amp; Bhagya Moment 5" loading="lazy"></div>
          <div class="gallery-item"><img src="asset/6.JPG" alt="Manoj &amp; Bhagya Moment 6" loading="lazy"></div>
          <div class="gallery-item"><img src="asset/7.JPG" alt="Manoj &amp; Bhagya Moment 7" loading="lazy"></div>
          <div class="gallery-item"><img src="asset/8.JPG" alt="Manoj &amp; Bhagya Moment 8" loading="lazy"></div>
          <div class="gallery-item"><img src="asset/9.JPG" alt="Manoj &amp; Bhagya Moment 9" loading="lazy"></div>
        </div>
      </section>

      <!-- INTERACTIVE WALL OF LOVE / GUESTBOOK SECTION -->
      <section class="section-card">
        <div class="section-title">Wall of Love</div>
        <div class="section-subtitle">Leave Your Wishes &amp; Blessings</div>
        <div class="gold-divider"></div>

        <div id="wishesBoard" class="wishes-board">
          <!-- Dynamic user wishes loaded here -->
        </div>

        <form id="wishForm" style="margin-top: 15px;">
          <div class="form-group">
            <input type="text" id="wishName" class="form-input" placeholder="Your Name" required>
          </div>
          <div class="form-group">
            <textarea id="wishMessage" class="form-textarea" rows="2" placeholder="Write your warm wishes for Manoj &amp; Bhagya's Homecoming..." required></textarea>
          </div>
          <button type="submit" class="btn-secondary" style="width: 100%; border-color: var(--primary-gold); background: #FFF;">
            <i class="fas fa-heart" style="color: var(--crimson-main);"></i> Post Blessing on Wall
          </button>
        </form>
      </section>

      <!-- RSVP CONTACT & GOOGLE FORM SECTION -->
      <section class="section-card" id="rsvp">
        <div class="section-title">Kindly Confirm Your Participation On Or Before 1St Of November 2026</div>
        <div class="gold-divider"></div>

        <!-- RSVP Notice -->
        <div class="rsvp-notice-box">
          <div class="rsvp-deadline">
            <i class="fas fa-envelope-open-text" style="color: var(--crimson-dark); margin-right: 6px;"></i>
           We Truly Appreciate Your Response And Can't Wait To Share This Special Day Together.
          </div>
         
        </div>

        <!-- Primary Google Form RSVP Link -->
        <div style="text-align: center; margin: 25px 0;">
           <a href="https://manoj-bhagyawedding.site.je/rsvp.php?status=yes" target="_blank" rel="noopener" style="text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:8px; width:270px; padding:14px 22px; margin:6px; font-size:0.95rem; font-weight:700; color:#fff; background:linear-gradient(135deg,#2e7d32,#43a047); border:none; border-radius:30px; box-shadow:0 8px 25px rgba(46,125,50,.35); transition:all .3s ease; font-family:inherit;">
            <i class="fas fa-check-circle" style="font-size:1.05rem;"></i> YES, I'M COMING
          </a>
        </div>

          <div style="text-align: center; margin: 25px 0;">
          <a href="https://manoj-bhagyawedding.site.je/rsvp.php?status=no" target="_blank" rel="noopener" class="btn-primary btn-rsvp-google" style="text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:8px; width:270px; padding:14px 22px; margin:6px; font-size:0.95rem; font-weight:700; color:#fff; background:linear-gradient(135deg,#8b1e2d,#b23a48); border:none; border-radius:30px; box-shadow:0 8px 25px rgba(139,30,45,.35); transition:all .3s ease; font-family:inherit;">
            <i class="fas fa-heart-broken" style="font-size:1.05rem;"></i> SORRY I CAN'T MAKE IT
          </a>
        </div>

        <!-- Direct RSVP Contacts -->
        <div class="contact-box-wrapper">
          <h4 style="font-family: var(--font-heading); font-size: 0.85rem; color: var(--crimson-dark); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px;">Direct Contact Numbers</h4>
          
          <div style="display: flex; justify-content: center; flex-wrap: wrap; gap: 10px;">
            <a href="tel:0717900456" class="contact-chip">
              <i class="fas fa-phone-alt"></i> Manoj: 071 790 0456
            </a>
            <a href="tel:0706666456" class="contact-chip">
              <i class="fas fa-phone-alt"></i> Bhagya: 070 666 6456
            </a>
          </div>
        </div>

        <div class="action-buttons-group" style="margin-top: 24px;">
          <button id="addToCalendarBtn" class="btn-secondary">
            <i class="far fa-calendar-plus"></i> Add to Google Calendar
          </button>

          <button id="downloadIcalBtn" class="btn-secondary">
            <i class="fas fa-file-export"></i> Download Apple Calendar (.ics)
          </button>
          
          <button id="shareWhatsappBtn" class="btn-secondary">
            <i class="fab fa-whatsapp"></i> Share Invitation on WhatsApp
          </button>

          <button id="replayEnvelopeBtn" class="btn-secondary">
            <i class="fas fa-envelope-open-text"></i> Replay Envelope Opening
          </button>
        </div>
      </section>

      <!-- FOOTER -->
      <footer class="invitation-footer">
        <p>Homecoming Night Party</p>
        <p>November 14, 2026</p>
        <p>Royal Rest House, Peradeniya • 5:30 PM</p>
        <p style="margin-top: 6px;">With Love <span class="footer-heart">♥</span> Manoj &amp; Bhagya</p>
        <p style="margin-top: 6px; font-size: 0.8rem; opacity: 0.7;">Created by Manoj Abeygunawardena</p>
      </footer>

    </main>

  </div>

  <!-- LIGHTBOX IMAGE MODAL OVERLAY -->
  <div id="imageModalOverlay" class="image-modal-overlay">
    <div class="image-modal-content">
      <button id="imageModalClose" class="image-modal-close" aria-label="Close Preview">&times;</button>
      <img id="imageModalImg" src="" alt="Enlarged Photo Preview">
    </div>
  </div>

  <!-- TOAST NOTIFICATION BOX -->
  <div id="toastMsg" class="toast-msg"></div>

  <!-- JavaScript Engine -->
  <script src="scrip.js"></script>
  <script>
    // Updates the browser URL to /Manoj-Bhagya-Wedding without reloading
    const newPath = "/Manoj-Bhagya-Homecoming";
    
    if (window.location.pathname !== newPath) {
      window.history.pushState({}, "", newPath);
    }
  </script>
</body>
</html>
